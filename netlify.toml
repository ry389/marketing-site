[build]
  publish = "dist"
  command = "npm run build"
[build.environment]
  NODE_VERSION = "22"
[build.processing.html]
  pretty_urls = false

[[redirects]]
  from = "/decapcms/*"
  to = "/admin/:splat"
  status = 200

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
