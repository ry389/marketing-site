backend:
  name: git-gateway
  branch: main

media_folder: 'src/assets/images/uploads'
public_folder: '~/assets/images/uploads'

collections:
  - name: 'post'
    label: 'Blog Posts'
    label_singular: 'Blog Post'
    folder: 'src/data/post'
    create: true
    slug: '{{slug}}'
    extension: 'md'
    format: 'frontmatter'
    summary: '{{title}}'
    fields:
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Excerpt', name: 'excerpt', widget: 'text', required: false }
      - { label: 'Category', name: 'category', widget: 'string', required: false }
      - {
          label: 'Tags',
          name: 'tags',
          widget: 'list',
          required: false,
          allow_add: true,
          allow_delete: true,
          collapsed: false,
          field: { label: 'Tag', name: 'tag', widget: 'string' },
        }
      - { label: 'Featured Image', name: 'image', widget: 'image', required: false }
      - { label: 'Publish Date', name: 'publishDate', widget: 'datetime', required: false }
      - { label: 'Updated Date', name: 'updateDate', widget: 'datetime', required: false }
      - { label: 'Author', name: 'author', widget: 'string', required: false }
      - { label: 'Draft', name: 'draft', widget: 'boolean', default: false, required: false }
      - label: 'SEO'
        name: 'metadata'
        widget: 'object'
        required: false
        collapsed: true
        fields:
          - { label: 'SEO Title', name: 'title', widget: 'string', required: false }
          - { label: 'SEO Description', name: 'description', widget: 'text', required: false }
          - { label: 'Canonical URL', name: 'canonical', widget: 'string', required: false }
      - { label: 'Content', name: 'body', widget: 'markdown' }
