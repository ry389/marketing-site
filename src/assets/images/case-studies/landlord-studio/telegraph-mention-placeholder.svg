<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">The Telegraph mention</title>
  <desc id="desc">The Telegraph headline and mention text for Landlord Studio.</desc>
  <rect width="960" height="560" fill="#f7f4ee"/>
  <rect x="54" y="48" width="852" height="464" rx="8" fill="#ffffff" stroke="#141414" stroke-opacity=".12" stroke-width="2"/>
  <text x="480" y="120" text-anchor="middle" fill="#141414" font-family="Georgia, serif" font-size="52" font-weight="700">The Telegraph</text>
  <line x1="110" y1="154" x2="850" y2="154" stroke="#141414" stroke-opacity=".18" stroke-width="2"/>
  <text x="110" y="218" fill="#141414" font-family="Georgia, serif" font-size="34" font-weight="700">
    <tspan x="110" dy="0">Landlords face £7k fine if they fail</tspan>
    <tspan x="110" dy="42">to send key document this week</tspan>
  </text>
  <rect x="110" y="292" width="700" height="12" rx="4" fill="#141414" fill-opacity=".12"/>
  <rect x="110" y="314" width="646" height="12" rx="4" fill="#141414" fill-opacity=".12"/>
  <rect x="110" y="336" width="584" height="12" rx="4" fill="#141414" fill-opacity=".12"/>
  <text x="110" y="374" fill="#555555" font-family="Arial, sans-serif" font-size="16" font-weight="400">
    <tspan x="110" dy="0">It is landlords’ responsibility to find the document, but only a small proportion of</tspan>
    <tspan x="110" dy="24">landlords downloaded the information sheet, data shows.</tspan>
    <tspan x="110" dy="32">The document was downloaded from the government website 153,000 times in the</tspan>
  </text>
  <rect x="104" y="460" width="584" height="24" rx="6" fill="#e2634f" fill-opacity=".15"/>
  <text x="110" y="450" fill="#555555" font-family="Arial, sans-serif" font-size="16" font-weight="400">
    <tspan x="110" dy="0">four weeks after publication in March, according to a Freedom of Information</tspan>
    <tspan x="110" dy="28">request by Landlord Studio, a property management platform.</tspan>
  </text>
  <a href="https://www.telegraph.co.uk/money/property/buy-to-let/landlords-warned-fines-failing-to-send-documents/" target="_blank">
    <text x="480" y="502" text-anchor="middle" fill="#555555" font-family="Arial, sans-serif" font-size="18" font-weight="700">View the article</text>
  </a>
</svg>
